[package]
name = "undo_token"
version = "0.2.0"
edition = "2021"
publish = false
repository = "https://github.com/agadape/undo"
description = "Undo rUSDC: wrapped USDC whose transfers can be undone inside a window (panic button, private court, trusted contacts)"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk.workspace = true
chacha20poly1305 = { version = "0.10.1", default-features = false, features = ["alloc"] }
curve25519-dalek = { version = "4.1.3", default-features = false }

[dev-dependencies]
near-sdk = { workspace = true, features = ["unit-testing"] }

# `cargo near build reproducible-wasm` builds inside this pinned image (identified by its digest), so anyone
# can rebuild the deployed code hash from the repository. Template from cargo-near 0.22 (`cargo near new`).
[package.metadata.near.reproducible_build]
image = "sourcescan/cargo-near:0.21.1-rust-1.96.0"
image_digest = "sha256:ccb22bb4e677ed022d8b9d1aa1b32f0af52dd0471ef1c32e48dedbf68ee6ee17"
passed_env = []
container_build_command = ["cargo", "near", "build", "non-reproducible-wasm", "--locked"]
