# Guard for Coba Curi: one idempotent tick (guard/guard.mjs) per run.
# The bait's window is 2 hours, so a tick every 15 minutes leaves a wide margin even when GitHub delays cron.
# 15 minutes keeps a private repo inside the free 2,000 Actions minutes a month (about 100 minutes a day).
# Once the repo is public, Actions minutes are free and the cron can go to "*/5 * * * *".
name: cobacuri-guard
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cobacuri-guard
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: undo/app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: undo/app/package-lock.json
      - run: npm ci --no-audit --no-fund --ignore-scripts
      - run: node guard/run-local.mjs --once
        env:
          GUARD_RUNNER: github
          COBACURI_CONTRACT_ID: cobacuri.nh-s26f-mvz1xz1q.testnet
          COBACURI_DEMO_ID: curi.nh-s26f-mvz1xz1q.testnet
          COBACURI_GUARD_ID: nh-s26f-mvz1xz1q.testnet
          COBACURI_GUARD_FC_KEY: ${{ secrets.COBACURI_GUARD_FC_KEY }}
          COBACURI_GUARD_PRIVATE_KEY: ${{ secrets.COBACURI_GUARD_PRIVATE_KEY }}
          COBACURI_DEMO_PRIVATE_KEY: ${{ secrets.COBACURI_DEMO_PRIVATE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
